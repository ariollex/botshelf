services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: botshelf
      POSTGRES_USER: botshelf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botshelf -d botshelf"]
      interval: 5s
      timeout: 3s
      retries: 20

  catalog:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://botshelf:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/botshelf?sslmode=disable
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:?set MAX_BOT_TOKEN in .env}
      MODERATOR_MAX_USER_IDS: ${MODERATOR_MAX_USER_IDS:?set MODERATOR_MAX_USER_IDS in .env}
      HTTP_ADDR: :8080
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/readyz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      catalog:
        condition: service_healthy

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
